[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonogram"
version = "0.1.0"
description = "Turn any image into a nonogram with exactly one logically reachable solution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
]
numba = [
    "numba>=0.59",
]

[project.scripts]
nonogram = "nonogram.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nonogram.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
